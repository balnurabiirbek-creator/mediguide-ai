name: mediguide_ai
description: MediGuide AI - Intelligent Health Assistant
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.1.1
  google_sign_in: ^6.3.0

  # Navigation
  go_router: ^14.8.1

  # UI & Animations
  animate_do: ^4.2.0
  lottie: ^3.3.1
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  google_fonts: ^6.3.1

  # Maps
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2

  # State Management
  provider: ^6.1.5

  # Utilities
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  url_launcher: ^6.3.2
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0F3F74"
  adaptive_icon_foreground: assets/branding/app_icon.png
